<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcroEPS — Carnet Numérique d'Îlot</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #0f766e;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --teacher-bg: #fffbeb;
      --teacher-border: #fef08a;
      --teacher-accent: #b45309;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
      line-height: 1.4;
    }

    /* Modal Verrouillage PIN */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .auth-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
    }

    .auth-card h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .auth-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .pin-field {
      width: 100%;
      font-size: 1.6rem;
      letter-spacing: 10px;
      text-align: center;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      background: #f8fafc;
      outline: none;
    }

    .pin-field:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-error {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 20px;
    }

    /* En-tête */
    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .badge-group {
      background: #e0f2fe;
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .badge-prof {
      background: #fef08a;
      color: var(--teacher-accent);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* Panneau de Gestion Professeur */
    #teacher-admin-panel {
      background: #fffdf5;
      border: 2px solid #facc15;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: none;
    }

    .admin-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #854d0e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (min-width: 680px) {
      .admin-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .admin-group-card {
      background: #fff;
      border: 1px solid #fde047;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .admin-group-card span {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #713f12;
      margin-bottom: 4px;
    }

    .admin-group-card input {
      width: 100%;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      padding: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
    }

    .admin-group-card input:focus {
      border-color: #0284c7;
      background: #fff;
    }

    .admin-nav-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px dashed #fde047;
    }

    .admin-nav-bar label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #854d0e;
    }

    .admin-nav-bar select {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-weight: 600;
    }

    /* Identification : Grand selfie + 6 élèves */
    .group-id-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 760px) {
      .group-id-hero {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .selfie-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .selfie-wrapper-large {
      width: 100%;
      height: 240px;
      border-radius: 12px;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .selfie-wrapper-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .selfie-placeholder {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      font-weight: 600;
      padding: 12px;
    }

    .names-section {
      flex: 1.8;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .names-section h3 {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .student-entry {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }

    .student-entry span {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      width: 24px;
    }

    .student-entry input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }

    .btn-photo-action {
      display: block;
      text-align: center;
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .input-file-hidden {
      display: none;
    }

    /* Section Vidéo PodÉduc */
    .video-hero {
      background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
      border: 1px solid #ccfbf1;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .video-hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .video-hero-header h2 {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .tag-sovereign {
      background: #ccfbf1;
      color: #115e59;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .video-player-container {
      width: 100%;
      height: 320px;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
    }

    .video-player-container iframe {
      width: 100%;
      height: 100%;
    }

    .video-placeholder {
      padding: 28px 16px;
      text-align: center;
      background: #fff;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 12px;
    }

    /* Catégories */
    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 16px;
    }

    .category-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .category-pill {
      background: #e2e8f0;
      color: #475569;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .category-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Grille figures */
    .figures-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 640px) {
      .figures-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .figure-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .photo-stage {
      width: 100%;
      height: 180px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .photo-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 8px;
    }

    .roles-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .role-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .role-row span {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      width: 16px;
    }

    .select-student {
      flex: 1.4;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
      color: var(--text-main);
      outline: none;
    }

    .select-role {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
      color: var(--primary-dark);
      font-weight: 600;
      outline: none;
    }

    /* Cadres enseignant */
    .teacher-box {
      background: var(--teacher-bg);
      border: 1px solid var(--teacher-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .teacher-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .teacher-box-header span {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--teacher-accent);
      text-transform: uppercase;
    }

    .btn-lock-action {
      background: none;
      border: none;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--teacher-accent);
      cursor: pointer;
      text-decoration: underline;
    }

    .teacher-box textarea, .teacher-box input[type="text"] {
      width: 100%;
      border: 1px solid #fef08a;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.82rem;
      background: #fff;
      color: #78350f;
      outline: none;
    }

    .teacher-box textarea {
      min-height: 48px;
